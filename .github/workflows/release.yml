name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  container:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/ghcr.yml
  release:
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release for verified container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.container.outputs.image }}
          DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving published notes.'
            exit 0
          fi
          printf 'Container: %s@%s\n\nBuilt from this tag after CI, security and CodeQL checks.\n' "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/release-notes.md"
          args=(--verify-tag --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" --title "$TAG")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
