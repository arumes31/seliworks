name: Security
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Dependencies and secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Scan repository history for credentials
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner .
      - name: Reject committed local secrets and tooling
        run: test -z "$(git ls-files -- ':(glob)**/.secrets' ':(glob)**/.secrets/**' ':(glob)**/.tools' ':(glob)**/.tools/**' ':(glob)**/.env' ':(glob)**/.env/**')"
      - name: Audit locked frontend dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts
          # Surgical allowlist for GHSA-fc5q-39xc-vjpf (picomatch ReDoS, dev/build-time
          # only; no upstream patch as of 2026-11-17 — remove once picomatch publishes
          # a version > 4.0.7). Still fails on any other high/critical advisory.
          # See .github/scripts/audit-allowlist.cjs
          npm audit --audit-level=high --json > audit.json || true
          node "$GITHUB_WORKSPACE/.github/scripts/audit-allowlist.cjs" audit.json
          rm -f audit.json
  container:
    name: Container vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build candidate image
        run: docker build --tag seliworks:security .
      - name: Reject high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: seliworks:security
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
