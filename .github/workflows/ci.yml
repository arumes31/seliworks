name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  invitation-security:
    name: PostgreSQL regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-regression-only
          POSTGRES_DB: seliworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seliworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:isolated-regression-only@127.0.0.1:5432/seliworks_test?sslmode=disable
      SELIWORKS_BROWSER_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare real-browser authentication regression
        working-directory: web
        run: |
          npm ci
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Verify account-security revocation with PostgreSQL and race detection
        run: go test -tags integration -race ./internal/app -run '^Test(InvitationSecurity|GermanActivitiesMigration|DeleteWork|Passkeys|FarmAssignments|Timesheet)' -count=1 -v
  source:
    name: Source build and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify formatting and modules
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod verify
          go vet ./...
      - name: Build published frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npx --no-install prettier --check src index.html vite.config.ts tsconfig.json
          npm run build
      - name: Verify onboarding and connection recovery
        working-directory: web
        run: |
          npx --no-install playwright install --with-deps chromium firefox
          node --test test/invitations-security.browser.mjs
          node --test test/connection.test.mjs test/connection.browser.mjs
          node --test test/updates.browser.mjs
          SELIWORKS_BROWSER=firefox node --test test/updates.browser.mjs
          node --test test/delete-work.browser.mjs test/passkeys.browser.mjs test/farm-assignments.browser.mjs
          node --test test/timesheet.browser.mjs
      - name: Build Go application
        run: go build -trimpath -o /tmp/seliworks ./cmd/seliworks
      - name: Verify cookie security and HTTPS configuration
        run: go test -race ./internal/app -run '^TestCookieSecurity' -count=1
      - name: Verify invoice PDF pagination
        run: go test -race ./internal/app -run '^Test(InvoicePDF|Timesheet)' -count=1
      - name: Validate production and development Compose
        env:
          APP_URL: https://work.example.com
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Build production image
        run: docker build --tag seliworks:ci .
      - name: Enforce non-root image
        run: test "$(docker image inspect seliworks:ci --format '{{.Config.User}}')" = '10001:10001'
      - name: Record verification scope
        run: |
          echo '### Published-source checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build, types, formatting, modules, Compose and image checks passed. The separate invitation-security job runs published PostgreSQL regressions with race detection. Other unit/integration/browser test sources are maintained locally and excluded from this repository.' >> "$GITHUB_STEP_SUMMARY"
  workflow-policy:
    name: Workflow and deployment lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 .github/scripts/lint-workflows.py
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: v1.31.1
          advanced-security: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Lint deployment scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh
