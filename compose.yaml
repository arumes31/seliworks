name: seliworks

x-app: &app
  image: seliworks:local
  build: .
  environment: &app-environment
    APP_ENV: ${APP_ENV:-production}
    APP_URL: ${APP_URL:?Set APP_URL in .env}
    DATABASE_URL_FILE: /run/secrets/database_url
    TOTP_KEY_FILE: /run/secrets/totp_key
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-false}
    SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATA_DIR: /var/lib/seliworks
    STATIC_DIR: /app/web/dist
    LISTEN_ADDR: :16540
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    TZ: UTC
  secrets:
    - database_url
    - totp_key
    - smtp_password
  volumes:
    - app-data:/var/lib/seliworks
  networks:
    - database
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    restart: unless-stopped
    networks:
      database: {}
      proxy:
        aliases: ["${PROXY_ALIAS:-seliworks}"]
    expose: ["16540"]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:16540/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *app
    profiles: [tools]
    command: [migrate]
    restart: "no"

  bootstrap:
    <<: *app
    profiles: [tools]
    command: [bootstrap]
    environment:
      <<: *app-environment
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-Administrator}
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets: [database_url, bootstrap_password, totp_key, smtp_password]
    restart: "no"

  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: seliworks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
    secrets: [postgres_password, app_database_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/initdb.sh:/docker-entrypoint-initdb.d/10-seliworks.sh:ro
    networks: [database]
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d seliworks"]
      interval: 5s
      timeout: 5s
      retries: 15

  backup: &backup
    image: postgres:18.6-alpine3.23
    profiles: [backup]
    user: "10001:10001"
    entrypoint: [sh, /scripts/backup-container.sh]
    environment:
      PGHOST: postgres
      PGUSER: seliworks
      PGDATABASE: seliworks
      PGCONNECT_TIMEOUT: "5"
    secrets: [app_database_password]
    volumes:
      - app-data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    networks: [database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy

  restore:
    <<: *backup
    entrypoint: [sh, /scripts/restore-container.sh]
    volumes:
      - app-data:/data
      - ${RESTORE_DIR:-./backups}:/restore:ro
      - ./scripts:/scripts:ro

networks:
  database:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  postgres-data:
  app-data:

secrets:
  database_url:
    file: ./.secrets/database_url
  postgres_password:
    file: ./.secrets/postgres_password
  app_database_password:
    file: ./.secrets/app_database_password
  bootstrap_password:
    file: ./.secrets/bootstrap_password
  totp_key:
    file: ./.secrets/totp_key
  smtp_password:
    file: ./.secrets/smtp_password
